x-enrichment-evidence:
  probed: '2026-07-20'
  dns: >-
    Only casai.com resolves (Amazon CloudFront, 13.33.82.0/24). api., developer(s)., docs., and
    status.casai.com return NXDOMAIN — there is no developer-surface hostname to enrich.
  discovery_paths: >-
    With a browser User-Agent, /.well-known/security.txt, /.well-known/openid-configuration,
    /.well-known/oauth-authorization-server, /.well-known/api-catalog, /.well-known/ai-plugin.json,
    /llms.txt, /openapi.json, /sitemap.xml, /api, /developers and /docs all return 404. Only
    /robots.txt returns 200.
  homepage: >-
    Title "Premium Holiday Rentals and Villas | Casai" (og:site_name "Casai Villas & Holiday Homes")
    — a villa-rate comparison site, not the original operator. Zero occurrences of "developer",
    "openapi", "swagger" or "graphql" in the served HTML.
  registries: >-
    No GitHub organization "casai" (404). No PyPI project. npm matches are unrelated third parties
    (CAS.AI ad monetization, an unrelated agent-workflow package). The one plausible original-company
    artifact, @casai-org/react-date-range, is a vendored FORK of hypeserver/react-date-range last
    published 2022-04 — a third-party UI component, not a first-party API client, so it is
    deliberately NOT wired as an SDKs/Packages pointer.
  other_hosts: >-
    robots.txt advertises blog.casai.com (200) and cdn.casai.com (200), but both belong to the
    successor villa-rental business, not the a16z-backed company this profile describes. No Blog
    pointer was added, to avoid attributing an unrelated entity's property to this company.
  rerun_gotcha: >-
    casai.com WAFs non-browser User-Agents: a default curl UA returns a blanket 403 on every path
    INCLUDING /robots.txt, which can be misread as "blocked" or as evidence of absence. Always
    re-probe with a browser User-Agent before concluding — the real answer is 404, not 403.
