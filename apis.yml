name: Casai
description: >-
  Casai was a technology-enabled short-term and furnished-apartment rental company operating across
  Latin America (notably Mexico and Brazil), surfaced as a portfolio company of a16z and added to the
  API Evangelist network as a stub for enrichment. The enrichment pass found no active developer
  surface for this entity. The casai.com domain now hosts an unrelated luxury villa rental business
  (Premium Holiday Rentals and Villas, curated by TravelAI), and no developer portal, API
  documentation, OpenAPI specification, SDKs, or public API is published under the original company.
  With no spec-bearing surface, no downstream enrichment artifacts (packages, well-known, MCP, scopes,
  errors, conformance, etc.) could be produced without fabrication, so this profile remains an
  identity-only lead.
